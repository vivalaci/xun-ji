<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>训记图标导出</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; text-align: center; padding: 40px; color: #111827; }
  canvas { border: 1px solid #eee; border-radius: 12px; margin: 20px; }
  button { background: #2563EB; color: #fff; border: none; padding: 12px 28px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  p { color: #6b7280; }
</style>
</head>
<body>
  <h2>训记 · 图标导出</h2>
  <canvas id="c" width="144" height="144"></canvas>
  <p>预览即为 144×144 实际尺寸</p>
  <button onclick="dl()">下载 icon.png（144×144）</button>

  <script>
    var svg = `<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
      <rect x="0" y="0" width="144" height="144" rx="32" fill="#111827"/>
      <polyline points="28,108 60,80 88,88 116,44" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="108" r="6" fill="#FFFFFF"/>
      <circle cx="60" cy="80" r="6" fill="#FFFFFF"/>
      <circle cx="88" cy="88" r="6" fill="#FFFFFF"/>
      <circle cx="116" cy="44" r="9" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    </svg>`;
    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var img = new Image();
    img.onload = function () { ctx.drawImage(img, 0, 0, 144, 144); };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));

    function dl() {
      canvas.toBlob(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'icon.png';
        a.click();
      }, 'image/png');
    }
  </script>
</body>
</html>
